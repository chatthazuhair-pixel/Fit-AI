name: FitAI checks

on:
  push:
    branches: ["main", "fitai/personalized-beginner-experience"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_PATH: ${{ runner.temp }}/fitai-test.db
      GEMINI_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run backend tests
        run: pytest -q
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          start = html.rfind("<script>")
          end = html.find("</script>", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not find the inline application script")
          Path("/tmp/fitai-app.js").write_text(html[start + len("<script>"):end], encoding="utf-8")
          PY
          node --check /tmp/fitai-app.js
